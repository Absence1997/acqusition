name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: lint-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        continue-on-error: true

      - name: Annotate ESLint issues
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::error title=ESLint failed::Linting issues were found. Run 'npm run lint:fix' locally to auto-fix what's fixable, review the rest, then commit and push again."

      - name: Annotate Prettier issues
        if: steps.prettier.outcome == 'failure'
        run: |
          echo "::error title=Prettier check failed::Formatting issues were found. Run 'npm run format' locally to auto-format the codebase, then commit and push again."

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Lint & Format Results"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            if [ "${{ steps.eslint.outcome }}" == "success" ]; then
              echo "| ESLint (\`npm run lint\`) | ✅ Passed |"
            else
              echo "| ESLint (\`npm run lint\`) | ❌ Failed — run \`npm run lint:fix\` |"
            fi
            if [ "${{ steps.prettier.outcome }}" == "success" ]; then
              echo "| Prettier (\`npm run format:check\`) | ✅ Passed |"
            else
              echo "| Prettier (\`npm run format:check\`) | ❌ Failed — run \`npm run format\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if issues were found
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: |
          echo "Lint and/or format checks failed. See the annotations and job summary above for how to fix."
          exit 1
